name: Windows Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name MusicMetadataResearcher app.py
      - name: Smoke test executable exists
        shell: pwsh
        run: |
          if (!(Test-Path 'dist/MusicMetadataResearcher.exe')) { throw 'Windows executable was not produced.' }
          Get-Item 'dist/MusicMetadataResearcher.exe' | Format-List Name,Length,FullName
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: MusicMetadataResearcher-Windows
          path: dist/MusicMetadataResearcher.exe
          if-no-files-found: error
